<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDM CVP for GN — Dashboard Monitoring</title>
<meta name="description" content="Dashboard monitoring post-distribution Cash & Voucher Programming (CVP) untuk Gift Notification (GN) Wahana Visi Indonesia">
<link rel="stylesheet" href="assets/css/dashboard.css">
<link rel="stylesheet" href="assets/css/print.css" media="print">
</head>
<body>
<a class="skip-link" href="#pages">Skip to dashboard / Lewati ke dashboard</a>

<div class="mobile-bar">
  <button type="button" class="mob-btn" id="mob-menu-toggle" aria-label="Menu Navigasi">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <span class="mob-title">Dashboard PDM CVP for GN</span>
  <div class="mob-actions">
    <button type="button" class="mob-btn lang-btn" id="mob-lang-toggle" aria-label="Switch Language / Mode English" title="Switch to English / Beralih ke Bahasa Indonesia">
      <svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    </button>
    <button type="button" class="mob-btn" id="mob-theme-toggle" aria-label="Ganti Mode Gelap / Terang" title="Ganti Mode Gelap / Terang">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</div>

<div class="sidebar-backdrop" id="backdrop"></div>

<div class="frame" id="app-frame">

<aside id="sidebar">
  <div class="aside-head">
    <button type="button" class="toggle-btn" id="menu-toggle" aria-label="Toggle Sidebar" title="Buka / Sembunyikan Sidebar">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="aside-actions">
      <button type="button" class="lang-btn" id="lang-toggle" aria-label="Switch Language / Mode English" title="Switch to English / Beralih ke Bahasa Indonesia">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </button>
      <button type="button" class="theme-btn" id="theme-toggle" aria-label="Ganti Mode Gelap / Terang" title="Ganti Mode Gelap / Terang">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </div>
  <nav id="nav"></nav>
  <div class="by">PEARL Lead</div>
</aside>

<main id="main-content">
  <div id="print-letterhead" class="print-letterhead"></div>
  <div class="dataset-bar"><div><label for="dataset-select" id="dataset-label">Dataset</label><select id="dataset-select" disabled></select></div><p id="dataset-status" role="status" aria-live="polite">Memuat data… / Loading data…</p></div>
  <div class="fbar filters-collapsed" id="fbar" hidden>
    <div class="fhead">
      <div class="fhead-left">
        <h4>FILTER</h4><button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="slicers">Tampilkan filter</button>
        <div class="fstat" id="f-stat"></div>
      </div>
      <div class="fhead-actions">
        <button type="button" class="f-act-btn" id="btn-export-csv" title="Unduh data terfilter dalam format CSV">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span id="btn-export-csv-txt">Ekspor CSV</span>
        </button>
        <button type="button" class="f-act-btn" id="btn-print-pdf" title="Cetak halaman aktif sebagai PDF">
          <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          <span id="btn-print-pdf-txt">Cetak Halaman</span>
        </button>
        <button type="button" class="f-act-btn primary" id="btn-print-all" title="Cetak seluruh area asesmen (Tabel 1–11) sebagai satu berkas PDF utuh untuk donor">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span id="btn-print-all-txt">Cetak Semua (Dossier)</span>
        </button>
        <button type="button" class="freset" id="f-reset" hidden>Bersihkan filter</button>
      </div>
    </div>
    <div class="slicers" id="slicers"></div>
  </div>
  <div id="pages" tabindex="-1" aria-busy="true"><div class="empty" role="status">Memuat dashboard… / Loading dashboard…</div></div>
<noscript><div class="empty">JavaScript is required to display this dashboard.</div></noscript>
</main>
</div>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
